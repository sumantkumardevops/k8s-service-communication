apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Replace with your own image, e.g. <dockerhub-user>/frontend:1.0
          image: YOUR_DOCKERHUB_USER/frontend:1.0
          ports:
            - containerPort: 8080
          env:
            # Just the Service name, no namespace or domain needed
            # because both services live in the same namespace.
            - name: BACKEND_URL
              value: "http://backend-service:5000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: demo-app
spec:
  type: LoadBalancer # use NodePort if you are on minikube/kind
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
